name: UI Automation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Укажите JUnit тег для запуска (например: LOGIN)'
        required: true
        default: 'LOGIN'

# Даем явные права на деплой официальному роботу GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Запрещаем одновременные деплои, чтобы они не конфликтовали
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Selenide Tests
        run: |
          TAG="${{ github.event.inputs.test_tag }}"
          if [ -z "$TAG" ]; then TAG="LOGIN"; fi
          mvn -B clean test -Denvironment=dev -Dbrowser=chrome -DisBackground=true -Dgroups="$TAG"

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true # <-- Этот флаг исправит ошибку 128, очистив конфликтную историю гит-веток
