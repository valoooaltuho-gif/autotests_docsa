name: UI Automation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Укажите JUnit тег для запуска (например: LOGIN)'
        required: true
        default: 'LOGIN'
      test_env:
        type: choice
        description: 'Выберите окружение для запуска тестов'
        required: true
        default: 'stg'       # Значение по умолчанию в дропдауне теперь stg
        options:
          - stg
          - prod

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Selenide Tests
        run: |
          TAG="${{ github.event.inputs.test_tag }}"
          if [ -z "$TAG" ]; then TAG="LOGIN"; fi
          
          # Если запуск автоматический (по push), переменная будет пустой, и запишется stg
          ENV="${{ github.event.inputs.test_env }}"
          if [ -z "$ENV" ]; then ENV="stg"; fi
          
          echo "Запуск тестов с тегом: $TAG на окружении: $ENV"
          
          mvn -B clean test -Denvironment="$ENV" -Dbrowser=chrome -DisBackground=true -Dgroups="$TAG"

      # Остальные шаги (Download history, Generate Allure, Deploy) остаются без изменений...
