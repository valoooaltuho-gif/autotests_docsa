name: UI Automation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Укажите JUnit тег для запуска (например: LOGIN)'
        required: true
        default: 'LOGIN'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Selenide Tests
        run: |
          TAG="${{ github.event.inputs.test_tag }}"
          if [ -z "$TAG" ]; then TAG="LOGIN"; fi
          mvn -B clean test -Denvironment=dev -Dbrowser=chrome -DisBackground=true -Dgroups="$TAG"

      # Используем официальный экшен для генерации Allure-отчета
      - name: Load Allure history and generate report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      # Нативный шаг 1: Формируем официальный веб-артефакт для GitHub Pages из сгенерированной папки
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: allure-report

      # Нативный шаг 2: Публикуем отчет напрямую на сайт
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: always()
