name: UI Automation Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Укажите JUnit тег для запуска (например: LOGIN)'
        required: true
        default: 'LOGIN'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Selenide Tests
        run: |
          TAG="${{ github.event.inputs.test_tag }}"
          if [ -z "$TAG" ]; then TAG="LOGIN"; fi
          mvn -B clean test -Denvironment=dev -Dbrowser=chrome -DisBackground=true -Dgroups="$TAG"

      # Шаг 1: Пытаемся скачать историю ИЗ ПРЕДЫДУЩЕГО успешного запуска на GitHub Actions
      - name: Download history from previous artifact
        uses: dawidd6/action-download-artifact@v9
        if: always()
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: run-tests.yml
          workflow_conclusion: success
          name: allure-report-artifact
          path: previous-allure-report

      # Шаг 2: Если прошлая история скачалась, перекладываем её в папку результатов для склеивания
      - name: Copy previous history to allure-results
        if: always()
        run: |
          if [ -d "previous-allure-report/history" ]; then
            mkdir -p allure-results/history
            cp -r previous-allure-report/history/* allure-results/history/
            echo "Предыдущая история успешно скопирована!"
          else
            echo "Предыдущая история не найдена, это первый прогон."
          fi

      # Шаг 3: Генерируем новый отчет (он объединит свежие результаты и старую историю)
      - name: Load Allure history and generate report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      # Шаг 4: Сохраняем сгенерированный отчет как артефакт GitHub Actions (нужно для скачивания в следующем прогоне)
      - name: Archive Allure Report for history tracking
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-artifact
          path: allure-report
          retention-days: 5

      # Шаг 5: Публикуем на сайт
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: always()
