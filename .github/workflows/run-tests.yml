name: Automation Tests

on:
  push:
    branches: [ "master"4 ] # Запуск при пуше в эти ветки
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # Позволит запускать тесты вручную кнопкой из интерфейса GitHub

jobs:
  test:
    runs-on: ubuntu-latest # Тесты будут бежать на Linux-сервере в облаке

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        # Флаг -B включает non-interactive mode (для логов CI)
        run: mvn -B clean test -Denvironment=dev -Dbrowser=chrome -DisBackground=true

      - name: Upload Allure Results
        if: always() # Выполнить даже если тесты упали
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 5
